<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>odin-library-project</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="header">
        <button id="addBookBtn" type="button">Add Book</button>
    </div>

    <div id="booksContainer"></div>

    <dialog id="addBookDialog" closedby="none">
        <p>Add a New Book</p>
        <form action="">
            <label for="book_title">Title:</label>
            <input type="text" id="book_title" name="book_title">

            <label for="book_author">Author:</label>
            <input type="text" id="book_author" name="book_author">

            <label for="book_pages">Pages:</label>
            <input type="number" id="book_pages" name="book_pages">

            <input type="checkbox" id="book_is_read" name="book_is_read">
            <label for="book_is_read">Have Read</label>

            <button id="saveAddBookDialog" type="button">Save</button>
            <button id="cancelAddBookDialog" type="button">Cancel</button>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>

</html>
